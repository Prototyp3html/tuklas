[project]
name = "tuklas-backend"
version = "0.1.0"
description = "TUKLAS — AI lead intelligence for freelancers selling web services to local PH businesses"
requires-python = ">=3.12"

# Managed with uv. See docs/BUILD_GUIDE.md Part 3, Milestone 1 and docs/DECISIONS.md.
# Dep choices that differ from the guide are deliberate — see the DECISIONS.md entry
# "Backend Milestones 1+2": bcrypt (not passlib), PyJWT (not python-jose), the
# sqlalchemy[asyncio] extra, and email-validator for pydantic EmailStr.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "email-validator>=2.2",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "playwright>=1.48",
    "celery>=5.4",
    "redis>=5.2",
    "tenacity>=9.0",
    "rapidfuzz>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "jupyter>=1.1",
]

# backend/ is a plain package, not an installable distribution. No [build-system].
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated schema migration — long sa.Column(...) lines are expected.
"backend/db/migrations/versions/0002_*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped loop: backend.db.session.engine is module-level, so its asyncpg
# connections must live on one loop for the whole run (a per-test loop + the
# Windows ProactorEventLoop is a known crash at connection teardown).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers"
