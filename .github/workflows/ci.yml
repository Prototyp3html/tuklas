name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Superuser `tuklas` — migration 0001 does CREATE ROLE tuklas_app.
        image: postgres:18
        env:
          POSTGRES_USER: tuklas
          POSTGRES_PASSWORD: tuklas
          POSTGRES_DB: tuklas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tuklas -d tuklas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://tuklas:tuklas@localhost:5432/tuklas
      DATABASE_URL: postgresql+asyncpg://tuklas_app:tuklas_app@localhost:5432/tuklas
      TEST_DATABASE_URL: postgresql+asyncpg://tuklas_app:tuklas_app@localhost:5432/tuklas_test
      JWT_SECRET: ci-secret-value-at-least-32-bytes-long
      BCRYPT_ROUNDS: "4"
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync deps (lockfile is load-bearing)
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Migrations are reversible
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Tests
        run: uv run pytest -q
