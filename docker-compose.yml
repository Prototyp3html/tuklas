# Skeleton only — Dockerfiles are added in Milestone 1. Not runnable yet.
services:
  api:
    # build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis
    # TODO (Milestone 1): add build context + volume mounts

  worker:
    # build: ./backend
    command: celery -A queue.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis
    # TODO (Milestone 1): share image with api

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tuklas
      POSTGRES_PASSWORD: tuklas
      POSTGRES_DB: tuklas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
